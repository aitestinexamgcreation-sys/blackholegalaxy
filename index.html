<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Galaxy - Real-time 3D Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="controls">
        <div class="control-panel">
            <h1>Black Hole Galaxy</h1>
            <p class="subtitle">Real-time 3D Gravitational Simulator</p>
            
            <div class="control-group">
                <label for="mode">Simulation Mode:</label>
                <select id="mode">
                    <option value="normal">Normal (10,000 particles)</option>
                    <option value="experimental">Experimental (100,000 particles)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="gravity">Black Hole Gravity:</label>
                <input type="range" id="gravity" min="0" max="2" step="0.1" value="1">
                <span id="gravityValue">1.0</span>
            </div>
            
            <div class="control-group">
                <label for="speed">Simulation Speed:</label>
                <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
                <span id="speedValue">1.0</span>
            </div>
            
            <div class="control-group">
                <button id="reset">Reset Simulation</button>
            </div>
            
            <div class="info">
                <div class="info-item">
                    <span class="label">Particles:</span>
                    <span id="particleCount">0</span>
                </div>
                <div class="info-item">
                    <span class="label">FPS:</span>
                    <span id="fps">0</span>
                </div>
            </div>
            
            <div class="credits">
                <p>Created by N0rvel</p>
                <p class="tech">Built with Three.js & GLSL shaders</p>
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
